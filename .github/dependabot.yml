# Dependabot configuration.
#
# Without this file GitHub only raises *security* updates (straight off security
# alerts). That is what produced the nine-PR backlog of November 2026: nothing
# was scheduled, nothing was grouped, and nothing merged them.
#
# Grouping matters more than it looks: every npm update rewrites
# package-lock.json, so ungrouped PRs all collide with each other and go stale
# the moment one of them merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The tiptap packages pin their peers at an EXACT version
      # (@tiptap/core peers @tiptap/pm "3.33.1"), so one of them moving alone
      # can never satisfy the peer graph — `npm install` fails with ERESOLVE.
      # Dependabot's own lockfile edit can still pass `npm ci`, so this has to
      # be prevented here rather than caught by CI. Listed first so it wins
      # over the groups below for these packages.
      tiptap:
        patterns:
          - "@tiptap/*"

      # One PR for all dev-only minor/patch bumps (eslint, typescript-eslint,
      # playwright, types) — these cannot reach production at runtime.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      # One PR for production patch bumps. Minors and majors stay separate so
      # they get read individually.
      production-patches:
        dependency-type: production
        update-types: ["patch"]
        # Keep the openai packages OUT of the group. The auto-merge workflow
        # holds any PR naming `openai` for a human, and `dependency-names`
        # covers every dependency in the PR — so if an openai patch rode along
        # inside this group, it would hold the whole group and the unrelated
        # patches in it would never land on their own.
        exclude-patterns:
          - "openai"
          - "@openai/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
